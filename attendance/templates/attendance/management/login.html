{% load static %}
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به پنل مدیریت</title><link rel="stylesheet" href="{% static 'attendance/css/style.css' %}"></head><body><div class="login-shell"><div class="login-card"><div class="mark">MG</div><h1>ورود به پنل مدیریت</h1><p class="sub">این ورود مستقل از حساب کاربری تقویم است.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="login-field"><label>نام کاربری</label><input name="username" autofocus required></div><div class="login-field"><label>رمز عبور</label><input type="password" name="password" required></div><input type="hidden" name="next" value="{{ next }}"><button class="login-submit" type="submit">ورود به مدیریت</button></form></div></div></body></html>
